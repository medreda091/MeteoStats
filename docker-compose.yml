services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: meteo
      POSTGRES_PASSWORD: meteo
      POSTGRES_DB: meteo
    volumes:
      - donnees-meteo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteo"]
      interval: 5s
      timeout: 5s
      retries: 5

  collecteur:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meteo:meteo@db:5432/meteo
    # collecte toutes les heures
    command: ["sh", "-c", "while true; do python -m meteo_stats.cli collecter; sleep 3600; done"]
    restart: unless-stopped

volumes:
  donnees-meteo:
